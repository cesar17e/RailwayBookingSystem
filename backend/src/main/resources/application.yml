spring:
  application:
    name: railway-booking-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/railway_booking}
    username: ${DATABASE_USERNAME:railway}
    password: ${DATABASE_PASSWORD:railway-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
